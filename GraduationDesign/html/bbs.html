<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/bbs/init.css">
    <script src="../js/jquery.min.js"></script>
    <title>学术论坛</title>
</head>
<body>
    <div id="init">
        <div id="top">
            <div id="top-txt">自强不息&nbsp;厚德载物</div>
            <div id="top-search">
                <div id="top-search-show">
                    <input type="text" placeholder="请输入论文标题关键词" id="top-search-input">
                </div>
                <button id="top-search-input-searchbtn">搜索</button>
            </div>
        </div>
        <div id="nav">
            <button class="navbtn" id="publish">发表论文</button>
            <hr>
            <button class="navbtn" id="special">专题论文</button>
            <button class="navbtn" id="debate">论辩论文</button>
            <button class="navbtn" id="review">综述论文</button>
            <button class="navbtn" id="synthesize">综合论文</button>
        </div>
    </div>
</body>
<script src="../js/bbs/search.js"></script>
<script src="../js/bbs/btns.js"></script>
</html>
